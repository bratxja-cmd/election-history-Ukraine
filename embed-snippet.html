<!-- Замініть USER та REPO на свої (напр. https://opora.github.io/election-timeline/) -->

<iframe
  id="election-timeline-frame"
  src="https://USER.github.io/REPO/"
  style="width:100%;border:0;min-height:600px;"
  loading="lazy"
  title="Вибори в Україні — хронологія">
</iframe>

<script>
window.addEventListener("message", function(e){
  if (e.data && e.data.type === "electionTimelineHeight"){
    var f = document.getElementById("election-timeline-frame");
    if (f) f.style.height = e.data.height + "px";
  }
});
</script>
